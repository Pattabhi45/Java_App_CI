name: Build Java CRUD Application

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout source code
      # ----------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Install Java 21
      # ----------------------------------------
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # ----------------------------------------
      # Build Spring Boot application
      # ----------------------------------------
      - name: Build application
        run: |
          mvn --batch-mode clean package -DskipTests

      # ----------------------------------------
      # Display generated JAR
      # ----------------------------------------
      - name: Display generated JAR files
        run: |
          echo "Generated JAR files:"
          find target -maxdepth 1 -type f -name "*.jar" -print

      # ----------------------------------------
      # Docker Hub Login
      # Only runs for version tags
      # ----------------------------------------
      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------
      # Build Docker Image
      # ----------------------------------------
      - name: Build Docker Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:${{ github.ref_name }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:latest" \
            .

      # ----------------------------------------
      # Push Version Image
      # ----------------------------------------
      - name: Push Version Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:${{ github.ref_name }}"

      # ----------------------------------------
      # Push Latest Image
      # ----------------------------------------
      - name: Push Latest Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:latest"

      # ----------------------------------------
      # Checkout Deployment Repository
      # ----------------------------------------
      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: Pattabhi45/Java_APP_deploy
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          path: deployment-repo

      # ----------------------------------------
      # Update Kubernetes Deployment Image
      # ----------------------------------------
      - name: Update Kubernetes Deployment Image
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:${{ github.ref_name }}"

          echo "Updating image to:"
          echo "$IMAGE"

          sed -i \
            "s|image: .*|image: $IMAGE|g" \
            deployment-repo/k8s/java-deployment.yaml

          echo "Updated deployment file:"

          grep -n "image:" \
            deployment-repo/k8s/java-deployment.yaml

      # ----------------------------------------
      # Commit and Push Deployment Changes
      # ----------------------------------------
      - name: Commit and Push Deployment Repository
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: deployment-repo
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/java-deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes detected."
            exit 0
          fi

          git commit \
            -m "Deploy spring-boot-crud-postgres-adminer:${{ github.ref_name }}"

          git push