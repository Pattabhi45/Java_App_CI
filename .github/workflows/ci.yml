name: Java CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '21'
  APP_NAME: spring-boot-crud-postgres-adminer
  GHCR_IMAGE: ghcr.io/pattabhi45/spring-boot-crud-postgres-adminer

jobs:
  build-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn clean test

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:latest \
            -t ${{ env.GHCR_IMAGE }}:latest \
            .

      - name: Push image to DockerHub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:latest

      - name: Push image to GHCR
        run: |
          docker push ${{ env.GHCR_IMAGE }}:latest

      - name: Trigger CD Repository
        run: |
          curl -i -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.CD_REPO_TOKEN }}" \
          https://api.github.com/repos/Pattabhi45/Java_APP_deploy/dispatches \
          -d '{
            "event_type":"deploy",
            "client_payload":{
              "image":"'"${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:latest"'",
              "tag":"latest"
            }
          }'