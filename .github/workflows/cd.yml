name: Deploy Publish Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Display tag information
      # ----------------------------------------
      - name: Display tag information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Git ref: ${{ github.ref }}"
          echo "Tag: ${{ github.ref_name }}"

      # ----------------------------------------
      # Checkout source code
      # ----------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Java
      # ----------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ----------------------------------------
      # Build Spring Boot Application
      # ----------------------------------------
      - name: Build application
        run: |
          mvn clean package -DskipTests

      # ----------------------------------------
      # Verify JAR
      # ----------------------------------------
      - name: Verify generated JAR
        run: |
          echo "Generated files:"
          find target -maxdepth 2 -type f -print

          JAR_FILE=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "original-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No deployable JAR file found"
            exit 1
          fi

          echo "JAR file found: $JAR_FILE"

      # ----------------------------------------
      # Login to GHCR
      # ----------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Generate metadata
      # ----------------------------------------
      - name: Generate Docker image metadata
        id: metadata
        run: |
          TAG_NAME="${{ github.ref_name }}"

          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # Build Docker image
      # ----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --tag "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/spring-boot-crud-postgres-adminer:${{ steps.metadata.outputs.tag_name }}" \
            --tag "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/spring-boot-crud-postgres-adminer:latest" \
            .

      # ----------------------------------------
      # Push version image
      # ----------------------------------------
      - name: Push version image
        run: |
          docker push \
            "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/spring-boot-crud-postgres-adminer:${{ steps.metadata.outputs.tag_name }}"

      # ----------------------------------------
      # Push latest image
      # ----------------------------------------
      - name: Push latest image
        run: |
          docker push \
            "ghcr.io/${{ steps.metadata.outputs.owner_lower }}/spring-boot-crud-postgres-adminer:latest"

      # ----------------------------------------
      # Checkout deployment repository
      # ----------------------------------------
      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
            repository: Pattabhi45/Java_APP_deploy
            token: ${{ secrets.DEPLOYMENT_TOKEN }}
            path: deployment-repo

      # ----------------------------------------
      # Update Kubernetes image
      # ----------------------------------------
      - name: Update Kubernetes Deployment Image
        run: |

          IMAGE="ghcr.io/${{ steps.metadata.outputs.owner_lower }}/spring-boot-crud-postgres-adminer:${{ steps.metadata.outputs.tag_name }}"

          echo "Updating image:"
          echo "$IMAGE"

          sed -i \
            "s|image: .*|image: $IMAGE|g" \
            deployment-repo/k8s/java-deployment.yaml

          echo "Updated deployment file:"

          grep -n "image:" \
            deployment-repo/k8s/java-deployment.yaml

      # ----------------------------------------
      # Commit and push changes
      # ----------------------------------------
      - name: Commit and Push Deployment Changes
        working-directory: deployment-repo
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/java-deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes detected"
            exit 0
          fi

          git commit \
            -m "Deploy spring-boot-crud-postgres-adminer:${{ steps.metadata.outputs.tag_name }}"

          git push